# Reverse proxy for the staging API container (docker-compose service api-stage, host port 5002).
#
# Install: sudo cp deploy/nginx/stage.api.fplultimate.com.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/stage.api.fplultimate.com.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d stage.api.fplultimate.com
# certbot's nginx plugin rewrites this file in place to add the 443/TLS server block and the
# 80->443 redirect — don't hand-write the TLS block yourself, let certbot manage it.

server {
    listen 80;
    server_name stage.api.fplultimate.com;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
