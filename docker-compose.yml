# Shared log rotation so container logs can't grow unbounded on the Pi's storage.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fpl_ultimate
      POSTGRES_USER: ${FPL_DB_USER:-fpl_user}
      POSTGRES_PASSWORD: ${FPL_DB_PASSWORD:-fpl_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d
    logging: *default-logging
    restart: unless-stopped

  # Built and pushed by .github/workflows/deploy-release.yml on every GitHub Release.
  api-prod:
    image: ghcr.io/adambaldwin1st/fpl-ultimate-api:latest
    ports:
      - "5000:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      FPL_DB_USER: ${FPL_DB_USER:-fpl_user}
      FPL_DB_PASSWORD: ${FPL_DB_PASSWORD:-fpl_password}
      FOOTBALL_API_USERNAME: ${FOOTBALL_API_USERNAME}
      FOOTBALL_API_PASSWORD: ${FOOTBALL_API_PASSWORD}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
    depends_on:
      - postgres
    logging: *default-logging
    restart: unless-stopped

  # Built and pushed by .github/workflows/deploy-stage.yml on every push to main.
  api-stage:
    image: ghcr.io/adambaldwin1st/fpl-ultimate-api:stage
    ports:
      - "5002:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: stage
      DB_HOST: postgres
      FPL_DB_USER: ${FPL_DB_USER:-fpl_user}
      FPL_DB_PASSWORD: ${FPL_DB_PASSWORD:-fpl_password}
      FOOTBALL_API_USERNAME: ${FOOTBALL_API_USERNAME}
      FOOTBALL_API_PASSWORD: ${FOOTBALL_API_PASSWORD}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
    depends_on:
      - postgres
    logging: *default-logging
    restart: unless-stopped

  # Live web UI over all container logs (http://<pi-lan-ip>:8081) — see DEPLOYMENT.md.
  # Bound without a host-IP prefix, so it's reachable on the LAN but not from the internet,
  # since 8081 is never forwarded through the router (only 80/443 are).
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    restart: unless-stopped


volumes:
  postgres_data:
