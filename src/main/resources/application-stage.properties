
# DataSource settings for PostgreSQL (staging — separate database, same Postgres instance as prod)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/fpl_ultimate_stage
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${FPL_DB_USER}
spring.datasource.password=${FPL_DB_PASSWORD}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
