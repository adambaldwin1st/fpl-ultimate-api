
# DataSource settings for PostgreSQL
# DB_HOST defaults to localhost for a bare `java -jar` run; docker-compose overrides it to the
# postgres service name so containers can reach each other over the compose network.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/fpl_ultimate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${FPL_DB_USER}
spring.datasource.password=${FPL_DB_PASSWORD}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Test to make sure FPL_DB_USER and FPL_DB_PASSWORD are loaded
logging.level.org.springframework.core.env=DEBUG
