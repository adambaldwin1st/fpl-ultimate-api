mock.football.api=false
spring.config.import=dotenv:/var/www/fpl-env/.env

# DataSource settings for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fpl_ultimate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${FPL_DB_USER}
spring.datasource.password=${FPL_DB_PASSWORD}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Test to make sure FPL_DB_USER and FPL_DB_PASSWORD are loaded
logging.level.org.springframework.core.env=DEBUG
