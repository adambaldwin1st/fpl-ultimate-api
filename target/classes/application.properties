# Database configuration
fpl.database.username=${FPL_DB_USER:fpl_db_user}
fpl.database.password=${FPL_DB_PASSWORD:fpl_db_password}

# API Configuration
football.api.host=${FOOTBALL_API_HOST}
football.api.username=${FOOTBALL_API_USERNAME}
football.api.password=${FOOTBALL_API_PASSWORD}
football.api.key=${FOOTBALL_API_KEY}

# Mock everything by default - check each environment's properties file
# to see what is enabled in that environment
mock.football.api=true

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG