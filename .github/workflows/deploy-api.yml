name: Deploy API

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Set up Maven
        run: |
          sudo apt-get install -y maven

      - name: Build with Maven
        run: mvn package

      - name: SFTP File Upload
        uses: depsypher/ftp-action@v2
        with:
          host: ${{ secrets.HOST_IP_ADDRESS }}
          username: ${{ secrets.USER }}
          localFile: build
          remoteDir: /path/on/remote/host

      - name: SSH into Raspberry Pi and Force Pull
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP_ADDRESS }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.FPL_ULTIMATE_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/html/fpl-ultimate/fpl-ultimate-api
            git fetch origin main
            git reset --hard origin/main
            echo "${{ secrets.HOST_PASSWORD }}" | sudo -S systemctl restart fpl-api
            echo "${{ secrets.HOST_PASSWORD }}" | sudo -S systemctl restart nginx
