name: Deploy API

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Select version type to increment"
        required: true
        type: choice
        options:
          - Major
          - Minor
          - Patch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Extract current version
      - name: Get current version
        id: get_version
        run: |
          # Get the latest tag or default to 0.0.0 if no tags exist
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      # Step 3: Increment version
      - name: Increment version
        id: increment_version
        run: |
          # Parse the current version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment based on input
          case "${{ github.event.inputs.version_type }}" in
            Major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            Minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            Patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          # Generate new version
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      # Step 4: Tag new version and push
      - name: Tag new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.new_version }}
          git push origin ${{ env.new_version }}

      # Step 5: Notify Discord - Deployment Started
      - name: Notify Discord - Deployment Started
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"🚀 Starting deployment of FPL Ultimate API version ${{ env.new_version }}..."}' \
            "$DISCORD_WEBHOOK_URL"

      # Step 6: SSH into Raspberry Pi and Force Pull
      - name: SSH into Raspberry Pi and Force Pull
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP_ADDRESS }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.FPL_ULTIMATE_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/adambaldwin/fpl-ultimate/fpl-ultimate-api
            git fetch origin
            git reset --hard origin/main
            echo "${{ secrets.HOST_PASSWORD }}" | sudo -S systemctl restart fpl-api
            echo "${{ secrets.HOST_PASSWORD }}" | sudo -S systemctl restart nginx

      # Step 7: Notify Discord - Deployment Completed
      - name: Notify Discord - Deployment Completed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"✅ Deployment of FPL Ultimate API version ${{ env.new_version }} completed successfully!"}' \
            "$DISCORD_WEBHOOK_URL"
